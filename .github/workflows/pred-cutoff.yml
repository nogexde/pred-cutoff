name: Pred cutoff till Discord

on:
  schedule:
    - cron: "*/15 * * * *"   # var 15:e minut
  workflow_dispatch:          # gör att du kan köra den manuellt

permissions:
  contents: write

concurrency:
  group: pred-cutoff
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Kolla flödet och posta
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pred_cutoff.py

      - name: Spara vad som redan postats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Uppdatera state" && git push)
